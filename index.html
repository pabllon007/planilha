<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado – Teoria da Pena</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#667085;
  --primary:#1d4ed8; --primary2:#2563eb; --ok:#15803d; --bad:#b91c1c;
  --border:#d9e1ec;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{background:linear-gradient(135deg,#102a56,#1d4ed8);color:white;padding:42px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
header p{margin:0;opacity:.9}
.container{max-width:980px;margin:28px auto;padding:0 16px}
.progress-wrap{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.95);backdrop-filter:blur(8px);padding:12px 0}
.progress{height:10px;background:#dbe4f2;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--primary2);transition:.3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.q-title{font-weight:800;font-size:19px;margin-bottom:14px}
.options{display:grid;gap:10px}
.option{border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.2s}
.option:hover{border-color:#8aa8e8;background:#f8fbff}
.option input{margin-top:5px}
.option.disabled{cursor:default}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px}
.feedback.correct{display:block;background:#ecfdf3;border:1px solid #bbf7d0}
.feedback.wrong{display:block;background:#fef2f2;border:1px solid #fecaca}
.feedback strong{display:block;margin-bottom:6px}
.explanation{margin-top:8px}
button{border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer}
#finish{background:var(--primary);color:white;width:100%;margin:22px 0}
#finish:disabled{opacity:.5;cursor:not-allowed}
#restart{background:#e8eef8;color:#17315f;margin-top:14px}
.result{display:none;text-align:center;background:white;border:1px solid var(--border);border-radius:18px;padding:30px;margin:24px 0}
.score{font-size:52px;font-weight:900;color:var(--primary);margin:8px 0}
.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:7px 12px;border-radius:99px;font-weight:800}
footer{text-align:center;color:var(--muted);padding:30px 16px}
.small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Simulado – Teoria da Pena</h1>
  <p>10 questões • Direito Penal • Regimes, PPL, PRD, multa e teorias da pena</p>
</header>

<div class="container">
  <div class="progress-wrap">
    <div class="small" id="progressText">0 de 10 respondidas</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="quiz"></div>

  <button id="finish" disabled>Finalizar prova e calcular nota</button>

  <div class="result" id="result">
    <div class="badge">PROVA CONCLUÍDA</div>
    <div class="score" id="score"></div>
    <h2 id="message"></h2>
    <p id="summary"></p>
    <button id="restart">Refazer prova</button>
  </div>
</div>

<footer>Simulado educativo • Confira sempre a legislação e a jurisprudência atualizadas.</footer>

<script>
const questions = [
{
 q:"1. Sobre os regimes de cumprimento da pena e o trabalho do preso, assinale a alternativa correta:",
 options:[
 "No regime fechado, o trabalho externo é obrigatório e realizado exclusivamente fora do estabelecimento prisional.",
 "No regime fechado, o trabalho pode ser realizado no estabelecimento prisional, e o trabalho externo é admitido nas hipóteses legais.",
 "No regime aberto, o condenado não pode exercer atividade profissional.",
 "No regime semiaberto, o condenado é proibido de trabalhar fora do estabelecimento.",
 "O trabalho do preso não precisa ser remunerado."
 ],
 answer:1,
 exp:"No regime fechado, o trabalho é realizado em regra no interior do estabelecimento, admitindo-se trabalho externo nas hipóteses legais. No semiaberto também pode haver trabalho externo. O trabalho do preso deve ser remunerado."
},
{
 q:"2. Sobre as teorias da pena, assinale a alternativa correta:",
 options:[
 "A teoria absoluta entende que a pena possui exclusivamente finalidade preventiva.",
 "A prevenção geral negativa busca ressocializar diretamente o condenado.",
 "A prevenção geral positiva está relacionada à reafirmação da validade das normas e da confiança social no Direito.",
 "A prevenção especial negativa busca intimidar toda a sociedade.",
 "A teoria mista rejeita qualquer finalidade preventiva da pena."
 ],
 answer:2,
 exp:"A prevenção geral positiva está ligada à reafirmação da validade da norma e à confiança social no ordenamento. Geral diz respeito à sociedade; especial, ao condenado. A prevenção geral negativa busca intimidar a sociedade."
},
{
 q:"3. Sobre o trabalho do condenado, assinale a alternativa correta:",
 options:[
 "O trabalho do preso é sempre gratuito.",
 "O trabalho do preso não possui relação com a execução da pena.",
 "O trabalho do preso deve ser remunerado e possui disciplina própria conforme o regime de cumprimento.",
 "O condenado em regime semiaberto jamais poderá trabalhar fora do estabelecimento.",
 "O condenado em regime aberto não pode exercer atividade profissional."
 ],
 answer:2,
 exp:"O Código Penal estabelece que o trabalho do preso será sempre remunerado, garantindo-se também os benefícios da Previdência Social. Trabalho prisional previsto em lei não se confunde com pena de trabalhos forçados."
},
{
 q:"4. Sobre a diferença entre reclusão e detenção, assinale a alternativa correta:",
 options:[
 "A detenção somente pode ser cumprida em regime fechado.",
 "A reclusão somente pode ser cumprida em regime aberto.",
 "A reclusão pode ser cumprida em regime fechado, semiaberto ou aberto; a detenção, em regra, em regime semiaberto ou aberto.",
 "Não existe diferença jurídica entre reclusão e detenção.",
 "A detenção sempre possui pena superior à reclusão."
 ],
 answer:2,
 exp:"A reclusão admite os três regimes como possibilidade inicial, conforme a lei e a fixação judicial. A detenção, em regra, não tem regime fechado como regime inicial, embora possa haver transferência para regime mais rigoroso."
},
{
 q:"5. Associe corretamente o regime ao estabelecimento: <br>I – Fechado; <br>II – Semiaberto; <br>III – Aberto. <br>( ) Casa do Albergado ou estabelecimento adequado. <br>( ) Estabelecimento de segurança máxima ou média. <br>( ) Colônia agrícola, industrial ou estabelecimento similar.",
 options:[
 "III – I – II",
 "I – II – III",
 "II – III – I",
 "III – II – I",
 "I – III – II"
 ],
 answer:0,
 exp:"A sequência correta é III – I – II: aberto → Casa do Albergado ou estabelecimento adequado; fechado → estabelecimento de segurança máxima ou média; semiaberto → colônia agrícola, industrial ou estabelecimento similar."
},
{
 q:"6. Assinale a alternativa que apresenta corretamente espécies de penas restritivas de direitos:",
 options:[
 "Reclusão, detenção e multa.",
 "Prestação pecuniária, perda de bens e valores, prestação de serviços à comunidade, interdição temporária de direitos e limitação de fim de semana.",
 "Reclusão, prestação pecuniária e multa.",
 "Detenção, prisão simples e prestação de serviços.",
 "Apenas prestação pecuniária e prestação de serviços."
 ],
 answer:1,
 exp:"As PRD previstas no art. 43 do Código Penal incluem prestação pecuniária, perda de bens e valores, prestação de serviços à comunidade ou entidades públicas, interdição temporária de direitos e limitação de fim de semana."
},
{
 q:"7. Pedro foi condenado por crime doloso a 3 anos de reclusão. O crime não foi cometido com violência ou grave ameaça à pessoa. Ele não é reincidente em crime doloso e as circunstâncias judiciais são favoráveis. Nesse caso:",
 options:[
 "A substituição é necessariamente proibida.",
 "A pena pode ser substituída por restritiva de direitos, desde que preenchidos os demais requisitos legais.",
 "Toda pena inferior a 4 anos deve obrigatoriamente ser convertida em multa.",
 "A substituição somente seria possível se a pena fosse inferior a 2 anos.",
 "A substituição somente é possível para crimes culposos."
 ],
 answer:1,
 exp:"O art. 44 do Código Penal prevê, entre outros requisitos, pena não superior a 4 anos para crime doloso, ausência de violência ou grave ameaça à pessoa, análise da reincidência e suficiência das circunstâncias judiciais."
},
{
 q:"8. Sobre a pena de multa, assinale a alternativa correta:",
 options:[
 "A multa penal é uma indenização paga diretamente à vítima.",
 "A multa penal pode ser convertida automaticamente em prisão caso o condenado não pague.",
 "A multa penal possui natureza de sanção penal e sua execução segue as regras próprias da legislação e da jurisprudência.",
 "A multa penal não pode, em nenhuma hipótese, ser objeto de desconto no vencimento ou salário.",
 "A multa deixa de ser uma pena depois do trânsito em julgado."
 ],
 answer:2,
 exp:"A multa é uma sanção penal e não se confunde com indenização à vítima. Seu inadimplemento não autoriza conversão automática em prisão. A execução da multa observa as regras legais e a jurisprudência, inclusive quanto à competência do Ministério Público perante o juízo da execução penal."
},
{
 q:"9. Em relação à substituição da pena privativa de liberdade por restritiva de direitos, assinale a alternativa correta:",
 options:[
 "Pena superior a 8 anos, ausência de reincidência e crime com violência.",
 "Pena não superior a 4 anos, crime sem violência ou grave ameaça à pessoa, ausência de reincidência impeditiva e circunstâncias judiciais favoráveis.",
 "Pena inferior a 10 anos e reincidência obrigatória.",
 "Qualquer pena pode ser substituída, desde que o réu seja primário.",
 "Basta que o condenado tenha bons antecedentes."
 ],
 answer:1,
 exp:"Para crime doloso, o art. 44 do Código Penal exige, entre outros requisitos, pena não superior a 4 anos, ausência de violência ou grave ameaça à pessoa, análise da reincidência e circunstâncias judiciais que indiquem a suficiência da substituição."
},
{
 q:"10. Carlos é reincidente e foi condenado a 3 anos e 6 meses de reclusão. As circunstâncias judiciais são favoráveis. Considerando a Súmula 269 do STJ, assinale a alternativa correta:",
 options:[
 "Carlos obrigatoriamente deverá iniciar no regime fechado.",
 "Carlos poderá iniciar no regime aberto apenas porque sua pena é inferior a 4 anos.",
 "É admissível a adoção do regime semiaberto, mesmo sendo Carlos reincidente, porque sua pena é igual ou inferior a 4 anos e as circunstâncias judiciais são favoráveis.",
 "A reincidência não produz nenhuma consequência na fixação do regime.",
 "Carlos deverá necessariamente cumprir toda a pena no regime semiaberto."
 ],
 answer:2,
 exp:"A Súmula 269 do STJ admite o regime semiaberto para reincidentes condenados a pena igual ou inferior a 4 anos, quando favoráveis as circunstâncias judiciais. A súmula não significa concessão automática do semiaberto em toda situação."
}
];

const quiz = document.getElementById("quiz");
const finish = document.getElementById("finish");
const result = document.getElementById("result");
let answered = 0, score = 0;

function render(){
  quiz.innerHTML = "";
  questions.forEach((item,i)=>{
    const card=document.createElement("section");
    card.className="card";
    card.innerHTML=`<div class="q-title">${item.q}</div>
      <div class="options">
      ${item.options.map((op,j)=>`
        <label class="option" data-q="${i}" data-a="${j}">
          <input type="radio" name="q${i}" value="${j}">
          <span><strong>${String.fromCharCode(65+j)})</strong> ${op}</span>
        </label>`).join("")}
      </div>
      <div class="feedback" id="fb${i}"></div>`;
    quiz.appendChild(card);
  });

  document.querySelectorAll(".option").forEach(el=>{
    el.addEventListener("click",()=>answer(Number(el.dataset.q),Number(el.dataset.a)));
  });
}

function answer(i,a){
  const inputs=document.querySelectorAll(`input[name="q${i}"]`);
  if([...inputs].some(x=>x.disabled)) return;
  inputs.forEach(x=>x.disabled=true);
  const labels=document.querySelectorAll(`[data-q="${i}"]`);
  labels.forEach(x=>x.classList.add("disabled"));
  const correct=questions[i].answer;
  const fb=document.getElementById("fb"+i);
  if(a===correct){
    score++;
    fb.className="feedback correct";
    fb.innerHTML=`<strong>✅ Resposta correta!</strong>${questions[i].exp}`;
  }else{
    fb.className="feedback wrong";
    fb.innerHTML=`<strong>❌ Resposta incorreta.</strong><div>Resposta correta: <strong>${String.fromCharCode(65+correct)}) ${questions[i].options[correct]}</strong></div><div class="explanation">${questions[i].exp}</div>`;
  }
  answered++;
  updateProgress();
}

function updateProgress(){
  document.getElementById("progressText").textContent=`${answered} de ${questions.length} respondidas`;
  document.getElementById("progressBar").style.width=(answered/questions.length*100)+"%";
  finish.disabled=answered!==questions.length;
}

finish.addEventListener("click",()=>{
  const nota=(score/questions.length*10).toFixed(1);
  document.getElementById("score").textContent=`${nota}/10`;
  let msg;
  if(score===10) msg="🏆 Excelente! Você gabaritou a prova!";
  else if(score>=8) msg="🎉 Parabéns! Ótimo desempenho!";
  else if(score>=6) msg="👏 Parabéns! Você concluiu a prova e teve um bom desempenho!";
  else msg="📚 Parabéns por concluir a prova! Revise os pontos indicados nas explicações e tente novamente.";
  document.getElementById("message").textContent=msg;
  document.getElementById("summary").textContent=`Você acertou ${score} de ${questions.length} questões. Sua nota foi ${nota}/10.`;
  result.style.display="block";
  result.scrollIntoView({behavior:"smooth"});
});

document.getElementById("restart").addEventListener("click",()=>{
  answered=0; score=0; result.style.display="none"; render(); updateProgress(); window.scrollTo({top:0,behavior:"smooth"});
});

render();
updateProgress();
</script>
</body>
</html>
